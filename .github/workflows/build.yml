name: Build

# Documentation and images do not change what the build produces, so a change touching only those
# does not need one. README.md is on the list even though it is packed into the NuGet package: the
# release workflow builds from the released commit regardless of what this one skipped.
#
# Deliberately not listed: anything under .github, samples and test. A workflow change should
# exercise itself, and a sample or a test is the part of the repository most likely to be wrong
# about the library.
#
# The two lists are duplicated rather than shared through a YAML anchor, because GitHub Actions
# does not expand anchors: an alias here would silently leave one trigger with no filter at all.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'images/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'images/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing is a result worth having from the other, not a reason to stop it.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # JsxCore restores npm packages itself, so a build needs no Node at all. npm is installed
      # anyway because a couple of tests hand a lock file JsxCore wrote to real npm and check that
      # npm ci accepts it. They skip themselves when npm is absent, and a check that passes by not
      # running is worth nothing on the machine meant to catch the difference.
      - name: Set up Node, for the tests that check npm accepts our lock file
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore
        run: dotnet restore JsxCore.slnx

      - name: Build
        run: dotnet build JsxCore.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test test/JsxCore.Tests
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ${{ github.workspace }}/TestResults

      - name: Upload test results
        # Results are most wanted precisely when the step before failed.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: ${{ github.workspace }}/TestResults/*.trx
          if-no-files-found: warn

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Packing is its own job because the two packages are assembled rather than just compiled:
      # JsxCore embeds the build tool's publish output, the analyzer, and the npm client assembly
      # its own lib folders would otherwise be missing. Every one of those is a way to get this
      # wrong that a successful build would not catch.
      - name: Pack
        run: |
          dotnet pack src/JsxCore --configuration Release --output artifacts
          dotnet pack src/JsxCore.Npm --configuration Release --output artifacts

      # The version comes off the package the step above just produced, rather than being written
      # here: a number repeated in a workflow is one that goes stale on the next bump, and this job
      # would then fail for a reason that has nothing to do with what it is checking.
      - name: Check the tool installs and runs
        run: |
          package=$(ls artifacts/JsxCore.Npm.*.nupkg)
          version=$(basename "$package" .nupkg)
          version=${version#JsxCore.Npm.}

          dotnet tool install --global JsxCore.Npm --add-source artifacts --version "$version"
          dotnet npm init --project "$RUNNER_TEMP/tool-check"
          dotnet npm add classnames --project "$RUNNER_TEMP/tool-check"
          dotnet npm list --project "$RUNNER_TEMP/tool-check"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
