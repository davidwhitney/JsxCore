<svg width="1280" height="440" viewBox="0 0 1280 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1035"/>
      <stop offset="55%" stop-color="#2D1B69"/>
      <stop offset="100%" stop-color="#1A1035"/>
    </linearGradient>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D3EEA"/>
      <stop offset="100%" stop-color="#4B21C0"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FEBFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="word" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C4ABFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6D3EEA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6D3EEA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="440" fill="url(#bbg)"/>
  <circle cx="320" cy="220" r="240" fill="url(#glow)"/>

  <!-- Mark (fusion2) -->
  <g transform="translate(110,100) scale(0.47)">
    <rect width="512" height="512" rx="120" fill="url(#tile)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
      <polyline points="150,158 92,256 150,354"/>
      <polyline points="362,158 420,256 362,354"/>
    </g>
    <g transform="translate(256,256)">
      <g fill="none" stroke="url(#orbit)" stroke-width="11">
        <ellipse cx="0" cy="0" rx="104" ry="40"/>
        <ellipse cx="0" cy="0" rx="104" ry="40" transform="rotate(60)"/>
        <ellipse cx="0" cy="0" rx="104" ry="40" transform="rotate(120)"/>
      </g>
      <circle cx="0" cy="0" r="22" fill="#8FEBFF"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="470" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="104" font-weight="700" fill="url(#word)" letter-spacing="-2">JsxCore</text>
  <text x="474" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#9FD8F5" letter-spacing="0.5">JSX &amp; React, natively in ASP.NET Core</text>
  <rect x="476" y="302" width="330" height="5" rx="2.5" fill="url(#orbit)"/>
</svg>
